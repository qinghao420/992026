<!DOCTYPE html>

<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            background-color: #000000;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* =========================
           页面主体
        ========================== */

        .wrap {
            width: 100%;
            max-width: 520px;
            display: none;
            position: relative;
            z-index: 1;
        }

        /* =========================
           密码弹窗
        ========================== */

        .password-mask {
            position: fixed;
            inset: 0;

            background: #000000;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 9999;

            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .password-box {
            width: 90%;
            max-width: 400px;

            background-color: #18140e;
            border: 1px solid #3a3324;
            border-radius: 16px;

            padding: 36px 26px;

            text-align: center;

            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .password-box h3 {
            color: #e6cd90;
            font-size: 22px;
            margin-bottom: 24px;
        }

        #pwd-input {
            width: 100%;

            padding: 14px 16px;

            background: #111111;
            border: 1px solid #443c2c;
            border-radius: 10px;

            color: #ffffff;
            font-size: 16px;

            outline: none;

            margin-bottom: 16px;

            -webkit-appearance: none;
            appearance: none;
        }

        #pwd-input:focus {
            border-color: #d4bc84;
        }

        .submit-pwd {
            width: 100%;

            padding: 14px;

            background: linear-gradient(
                180deg,
                #c9b278,
                #998450
            );

            border: none;
            border-radius: 10px;

            font-size: 16px;
            color: #000000;
            font-weight: 500;

            cursor: pointer;

            -webkit-appearance: none;
            appearance: none;

            touch-action: manipulation;
        }

        .submit-pwd:active {
            transform: scale(0.98);
        }

        .tip-error {
            color: #ff7777;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }

        /* =========================
           顶部卡片
        ========================== */

        .top-card {
            background-color: #18140e;

            border: 1px solid #3a3324;
            border-radius: 16px;

            padding: 30px 20px;

            text-align: center;

            margin-bottom: 20px;
        }

        .top-tag {
            font-size: 14px;
            color: #d4bc84;

            letter-spacing: 1px;

            border: 1px solid #d4bc8470;

            display: inline-block;

            padding: 4px 14px;

            border-radius: 20px;

            margin-bottom: 12px;
        }

        .top-card h1 {
            font-size: 32px;
            color: #e6cd90;

            font-weight: normal;

            letter-spacing: 2px;
        }

        .top-card p {
            color: #b8a882;

            font-size: 14px;

            line-height: 1.7;

            margin-top: 8px;
        }

        .top-card a {
            color: #e6cd90;
            text-decoration: none;

            /* 增加移动端点击区域 */
            display: inline-block;

            padding: 2px 0;
        }

        .top-card a:active {
            opacity: 0.7;
        }

        /* =========================
           主体卡片
        ========================== */

        .main-card {
            background-color: #18140e;

            border: 1px solid #3a3324;
            border-radius: 16px;

            padding: 36px 26px;

            text-align: center;
        }

        /* =========================
           下载行
        ========================== */

        .download-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;

            width: 100%;
        }

        .download-row:last-child {
            margin-bottom: 0;
        }

        .left-group {
            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        /* =========================
           APP图标
        ========================== */

        .icon-box {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border-radius: 8px;

            background: #272218;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #e6cd90;

            font-size: 22px;

            border: 1px solid #443c2c;

            overflow: hidden;
        }

        .icon-box img {
            width: 40px;
            height: 40px;

            object-fit: cover;

            border-radius: 8px;

            display: block;
        }

        .text-name {
            color: #e2d3ad;

            font-size: 16px;

            white-space: nowrap;
        }

        /* =========================
           按钮
        ========================== */

        .gold-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            padding: 10px 26px;

            background: linear-gradient(
                180deg,
                #c9b278,
                #998450
            );

            color: #000000;

            border: none;

            border-radius: 24px;

            font-size: 15px;

            text-decoration: none;

            font-weight: 500;

            white-space: nowrap;

            cursor: pointer;

            /*
             * 移动端点击兼容
             */
            touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;

            -webkit-tap-highlight-color: transparent;
        }

        .gold-btn:hover {
            filter: brightness(1.1);
        }

        .gold-btn:active {
            transform: scale(0.97);
            filter: brightness(0.95);
        }

        /* =========================
           底部提示
        ========================== */

        .bottom-tips {
            text-align: center;

            margin-top: 24px;

            color: #887c64;

            font-size: 12px;
        }

        /* =========================
           手机端
        ========================== */

        @media screen and (max-width: 768px) {

            body {
                padding: 14px;
            }

            .top-card {
                padding: 26px 16px;
            }

            .top-card h1 {

            }

            }

            .left-group {

            }

            .icon-box {
                width: 38px;
                height: 38px;
            }

            .icon-box img {
                width: 38px;

        }

        @media screen and (max-width: 360px) {

            .main-card {

            }

                font-size: 11px;
            }

            .text-name {
                font-size: 11px;
            }

            .left-group {
                gap: 7px;
            }
        }
    </style>
</head>

    <!-- =========================
         密码验证
    ========================== -->

    <script>

        const AccessPassword = "6668";

        const pwdMask = document.getElementById("pwdMask");
        const pwdInput = document.getElementById("pwd-input");
        const submitPwd = document.getElementById("submitPwd");
        const errTip = document.getElementById("errTip");
        const pageWrap = document.querySelector(".wrap");


        function checkPassword() {

            const inputVal = pwdInput.value.trim();

            if (inputVal === AccessPassword) {

                pwdMask.style.display = "none";

                pageWrap.style.display = "block";

                errTip.style.display = "none";

            } else {

                errTip.style.display = "block";

                pwdInput.value = "";

                pwdInput.focus();

            }

        }


        /* 点击确认 */

        submitPwd.addEventListener("click", function () {

            checkPassword();

        });


        /* 输入框按回车 */

        pwdInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                checkPassword();

            }

        });


        /* 点击弹窗空白位置取消焦点 */

        pwdMask.addEventListener("click", function (event) {

            if (event.target === pwdMask) {

                pwdInput.blur();

            }

        });

    </script>
