<!-- =========================
     动态黑金背景 JS
========================= -->
<script>
(function(){

    const canvas = document.getElementById("goldFlowBg");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = 1;
    let time = 0;

    let particles = [];

    function resize(){

        width = window.innerWidth;
        height = window.innerHeight;

        dpr = Math.min(window.devicePixelRatio || 1,2);

        canvas.width = width * dpr;
        canvas.
          height = height * dpr;

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );
    }

    function createParticles(){

        particles = [];

        const mobile = width <= 768;
        const count = mobile ? 110 : 300;

        for(let i=0;i<count;i++){

            particles.push({
                x:Math.random() * width,
                y:Math.random() * height,
                size:Math.random() * 1.7 + .25,
                speed:Math.random() * .32 + .03,
                alpha:Math.random() * .65 + .12,
                phase:Math.random() * Math.PI * 2
            });
        }
    }

    function drawParticles(){

        for(let i=0;i<particles.length;i++){

            const p = particles[i];

            p.y -= p.speed;

            p.x += Math.sin(
                time * .001 +
                p.phase
            ) * .10;

            if(p.y < -20){
                p.y = height + 20;
                p.x = Math.random() * width;
            }

            if(p.x < -20){
                p.x = width + 20;
            }

            if(p.x > width + 20){
                p.x = -20;
            }

            const twinkle =
                .55 +
                Math.sin(
                    time * .004 +
                    p.phase
                ) * .45;

            ctx.beginPath();

            ctx.fillStyle =
                "rgba(255,215,130," +
                (p.alpha * twinkle) +
                ")";

            ctx.shadowBlur =
                p.size > 1 ? 12 : 5;

            ctx.shadowColor =
                "rgba(255,200,90,.8)";

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.shadowBlur = 0;
    }

    function drawLeftRing(){

        const x = width * -.28;
        const y = height * .55;

        const radius =
            Math.min(width,height) * .68;

        const move =
            Math.sin(time * .00035) * .045;

        const start = .20 + move;
        const end = 1.58 + move;

        const gradient =
            ctx.createRadialGradient(
                x,y,radius - 75,
                x,y,radius + 75
            );

        gradient.addColorStop(
            0,
            "rgba(255,220,150,0)"
        );

        gradient.addColorStop(
            .43,
            "rgba(255,210,120,.04)"
        );

        gradient.addColorStop(
            .50,
            "rgba(255,215,130,.62)"
        );

        gradient.addColorStop(
            .56,
            "rgba(255,195,90,.22)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,220,160,0)"
        );

        ctx.beginPath();

        ctx.strokeStyle = gradient;

        ctx.lineWidth =
            width <= 768 ? 42 : 82;

        ctx.lineCap = "round";

        ctx.shadowBlur = 38;

        ctx.shadowColor =
            "rgba(255,195,80,.55)";

        ctx.arc(
            x,
            y,
            radius,
            start,
            end
        );

        ctx.stroke();
    }

    function drawRightRing(){

        const x = width * 1.28;
        const y = height * .45;

        const radius =
            Math.min(width,height) * .63;

        const move =
            Math.sin(time * .0004) * .045;

        const start = -2.72 + move;
        const end = -1.34 + move;

        const gradient =
            ctx.createRadialGradient(
                x,y,radius - 75,
                x,y,radius + 75
            );

        gradient.addColorStop(
            0,
            "rgba(255,220,150,0)"
        );

        gradient.addColorStop(
            .43,
            "rgba(255,210,120,.05)"
        );

        gradient.addColorStop(
            .50,
            "rgba(255,215,130,.70)"
        );

        gradient.addColorStop(
            .57,
            "rgba(255,195,90,.25)"
        );
      gradient.addColorStop(
            1,
            "rgba(255,220,160,0)"
        );

        ctx.beginPath();

        ctx.strokeStyle = gradient;

        ctx.lineWidth =
            width <= 768 ? 45 : 92;

        ctx.lineCap = "round";

        ctx.shadowBlur = 42;

        ctx.shadowColor =
            "rgba(255,195,80,.65)";

        ctx.arc(
            x,
            y,
            radius,
            start,
            end
        );

        ctx.stroke();
    }

    function drawFlowLine(){

        const y =
            height * .53;

        const pulse =
            .75 +
            Math.sin(time * .003) * .25;

        const gradient =
            ctx.createLinearGradient(
                0,y,width,y
            );

        gradient.addColorStop(
            0,
            "rgba(255,215,130,0)"
        );

        gradient.addColorStop(
            .20,
            "rgba(255,215,130,.03)"
        );

        gradient.addColorStop(
            .50,
            "rgba(255,215,130," +
            (.18 * pulse) +
            ")"
        );

        gradient.addColorStop(
            .80,
            "rgba(255,215,130,.03)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,215,130,0)"
        );

        ctx.beginPath();

        ctx.strokeStyle = gradient;

        ctx.lineWidth =
            width <= 768 ? 4 : 8;

        ctx.shadowBlur = 20;

        ctx.shadowColor =
            "rgba(255,195,80,.45)";

        ctx.moveTo(0,y);
        ctx.lineTo(width,y);

        ctx.stroke();
    }

    function drawCenterGlow(){

        const x = width / 2;
        const y = height / 2;

        const size =
            Math.min(width,height) * .43;

        const gradient =
            ctx.createRadialGradient(
                x,y,0,
                x,y,size
            );

        gradient.addColorStop(
            0,
            "rgba(255,215,130,.10)"
        );

        gradient.addColorStop(
            .35,
            "rgba(190,135,45,.045)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    function animate(){

        time++;

        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        /* 最底层黑色 */
        ctx.fillStyle = "#030303";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        drawCenterGlow();
        drawLeftRing();
        drawRightRing();
        drawFlowLine();
        drawParticles();

        requestAnimationFrame(animate);
    }

    resize();
    createParticles();
    animate();

    window.addEventListener(
        "resize",
        function(){
            resize();
            createParticles();
        }
    );

})();
</script>
