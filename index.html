<!-- 优化viewport，禁止缩放，解决iOS基础兼容 -->

<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; /*消除点击300ms延迟*/
}
body {
  min-height: 100vh;
  background-color: #070707;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(212, 188, 132, 0.12), transparent 45%),
    radial-gradient(circle at 80% 20%, rgba(212, 188, 132, 0.08), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(212, 188, 132, 0.15), transparent 55%),
    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
  background-size: auto, auto, auto, 44px 44px, 44px 44px;
  font-family: "Microsoft YaHei", PingFang SC, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* 第一层：缓慢流动的暗金网格 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(212, 188, 132, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 188, 132, 0.045) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
  animation: gridMove 18s linear infinite;
}

/* 第二层：高级暗金光带与粒子 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 50% 50%, rgba(230, 205, 144, 0.18) 0%, rgba(230, 205, 144, 0.04) 25%, transparent 55%),
    radial-gradient(1px 1px at 15% 25%, rgba(255, 225, 170, 0.5), transparent 60%),
    radial-gradient(1px 1px at 35% 75%, rgba(255, 225, 170, 0.35), transparent 60%),
    radial-gradient(1px 1px at 75% 30%, rgba(255, 225, 170, 0.45), transparent 60%),
    radial-gradient(1px 1px at 85% 80%, rgba(255, 225, 170, 0.3), transparent 60%),
    radial-gradient(1px 1px at 45% 45%, rgba(255, 225, 170, 0.25), transparent 60%);
  background-size: 300px 300px;
  pointer-events: none;
  z-index: 0;
  animation: premiumFloat 14s ease-in-out infinite alternate;
}

/* 第三层：边缘暗金光带 */
.edge-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(circle at 10% 50%, rgba(212, 188, 132, 0.12), transparent 35%),
    radial-gradient(circle at 90% 50%, rgba(212, 188, 132, 0.1), transparent 35%),
    radial-gradient(circle at 50% 10%, rgba(212, 188, 132, 0.08), transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(212, 188, 132, 0.14), transparent 40%);
  animation: edgeBreath 10s ease-in-out infinite alternate;
}

@keyframes gridMove {
  0% {
    background-position: 0 0, 0 0;
  }
  100% {
    background-position: 60px 60px, 60px 60px;
  }
}

@keyframes premiumFloat {
  0% {
    opacity: 0.45;
    transform: translate3d(0, 0, 0) scale(1);
  }
  100% {
    opacity: 0.75;
    transform: translate3d(-18px, -10px, 0) scale(1.06);
  }
}

@keyframes edgeBreath {
  0% {
    opacity: 0.5;
    transform: scale(1);
  }
  100% {
    opacity: 0.9;
    transform: scale(1.04);
  }
}
.wrap {
  width: 100%;
  max-width: 520px;

}

.download-row{

@media screen and (max-width: 768px) {
