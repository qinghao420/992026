/* 第一层：缓慢流动的暗金网格 */

  inset: 0;
  background:
    linear-gradient(rgba(212, 188, 132, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 188, 132, 0.045) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
  animation: gridMove 18s linear infinite;
}
/* 第三层：边缘暗金光带 */
.edge-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:

    radial-gradient(circle at 50% 90%, rgba(212, 188, 132, 0.14), transparent 40%);
  animation: edgeBreath 10s ease-in-out infinite alternate;
}
@keyframes gridMove {
  0% {
    background-position: 0 0, 0 0;
  }
  100% {
    background-position: 60px 60px, 60px 60px;
  }
}
@keyframes edgeBreath {
  0% {
    opacity: 0.5;
    transform: scale(1);
  }
  100% {

<canvas id="goldFlowBg" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
<script>
(function(){
  const canvas = document.getElementById('goldFlowBg');
  const ctx = canvas.getContext('2d');
  let width, height, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let particles = [];
  let ribbons = [];
  let time = 0;
  function resize(){
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init(){
    resize();
    particles = [];
    ribbons = [];
    // 细碎金色粒子
    const particleCount = Math.floor((width * height) / 5500);
    for(let i = 0; i < particleCount; i++){
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random() * 0.5 + 0.25,
        life: Math.random() * 200
      });
    }
    // 流体光带
    const ribbonCount = Math.max(3, Math.floor(width / 420));
    for(let i = 0; i < ribbonCount; i++){
      ribbons.push({
        startX: Math.random() * width,
        startY: Math.random() * height,
        angle: Math.random() * Math.PI * 2,
        speed: 0.004 + Math.random() * 0.008,
        length: 120 + Math.random() * 180,
        width: 4 + Math.random() * 8,
        hue: 45 + Math.random() * 10,
        alpha: 0.06 + Math.random() * 0.08
      });
    }
  }
  function drawParticles(){
    for(let i = 0; i < particles.length; i++){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life++;
      // 微弱流体扰动
      p.vx += Math.sin(time * 0.001 + p.y * 0.01) * 0.002;
      p.vy += Math.cos(time * 0.001 + p.x * 0.01) * 0.002;
      p.vx *= 0.995;
      p.vy *= 0.995;
      if(p.x < 0) p.x = width;
      if(p.x > width) p.x = 0;
      if(p.y < 0) p.y = height;
      if(p.y > height) p.y = 0;
      const twinkle = 0.6 + 0.4 * Math.sin(time * 0.004 + p.life * 0.03);
      ctx.beginPath();
      ctx.fillStyle = `rgba(255, 225, 170, ${p.a * twinkle})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(230, 205, 144, 0.8)';
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
  function drawRibbons(){
    for(let i = 0; i < ribbons.length; i++){
      const r = ribbons[i];
      r.angle += r.speed;
      const x1 = r.startX + Math.cos(r.angle) * r.length;
      const y1 = r.startY + Math.sin(r.angle) * r.length;
      const x2 = r.startX - Math.cos(r.angle) * r.length;
      const y2 = r.startY - Math.sin(r.angle) * r.length;
      const grad = ctx.createLinearGradient(x1, y1, x2, y2);
      grad.addColorStop(0, `hsla(${r.hue}, 80%, 65%, 0)`);
      grad.addColorStop(0.5, `hsla(${r.hue}, 80%, 65%, ${r.alpha})`);
      grad.addColorStop(1, `hsla(${r.hue}, 80%, 65%, 0)`);
      ctx.beginPath();
      ctx.strokeStyle = grad;
      ctx.lineWidth = r.width;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(212, 188, 132, 0.6)';
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  function drawEdgeGlow(){
    const grad1 = ctx.createRadialGradient(
      width * 0.1, height * 0.5, 0,
      width * 0.1, height * 0.5, Math.max(width, height) * 0.4
    );
    grad1.addColorStop(0, 'rgba(212, 188, 132, 0.12)');
    grad1.addColorStop(1, 'rgba(212, 188, 132, 0)');
    ctx.fillStyle = grad1;
    ctx.fillRect(0, 0, width, height);
    const grad2 = ctx.createRadialGradient(
      width * 0.9, height * 0.5, 0,
      width * 0.9, height * 0.5, Math.max(width, height) * 0.4
    );
    grad2.addColorStop(0, 'rgba(212, 188, 132, 0.1)');
    grad2.addColorStop(1, 'rgba(212, 188, 132, 0)');
    ctx.fillStyle = grad2;
    ctx.fillRect(0, 0, width, height);
  }
  function animate(){
    time++;
    ctx.clearRect(0, 0, width, height);
    drawEdgeGlow();
    drawRibbons();
    drawParticles();
    requestAnimationFrame(animate);
  }
  window.addEventListener('resize', init);
  init();
  animate();
})();
</script>
