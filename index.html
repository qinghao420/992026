<!-- =====================================================
     黑金电影感动态背景程序
===================================================== -->

<script>

(function(){

    const canvas =
        document.getElementById(
            "goldCinemaBg"
        );

    const ctx =
        canvas.getContext("2d");


    let W = 0;
    let H = 0;

    let DPR = 1;

    let time = 0;

    let particles = [];

    let stars = [];


    /* =================================================
       调整画布
    ================================================= */

    function resize(){

        W = window.innerWidth;

        H = window.innerHeight;

        DPR =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );

        canvas.width =
            W * DPR;

        canvas.height =
            H * DPR;

        canvas.style.width =
            W + "px";

        canvas.style.height =
            H + "px";

        ctx.setTransform(
            DPR,
            0,
            0,
            DPR,
            0,
            0
        );

    }


    /* =================================================
       创建粒子
    ================================================= */

    function createParticles(){

        particles = [];

        stars = [];


        const mobile =
            W < 768;


        const particleCount =
            mobile ? 100 : 360;


        const starCount =
            mobile ? 35 : 90;


        /* 小金色粒子 */

        for(
            let i = 0;
            i < particleCount;
            i++
        ){

            particles.push({

                x:
                    Math.random() * W,

                y:
                    Math.random() * H,

                size:
                    Math.random() * 1.5 + .25,

                speed:
                    Math.random() * .18 + .025,

                drift:
                    Math.random() * .5 + .05,

                alpha:
                    Math.random() * .55 + .15,

                phase:
                    Math.random() *
                    Math.PI * 2,

                twinkle:
                    Math.random() *
                    .035 + .01

            });

        }


        /* 大型星光 */

        for(
            let i = 0;
            i < starCount;
            i++
        ){

            stars.push({

                x:
                    Math.random() * W,

                y:
                    Math.random() * H,

                size:
                    Math.random() * 2.7 + .7,

                alpha:
                    Math.random() * .6 + .2,

                phase:
                    Math.random() *
                    Math.PI * 2,

                speed:
                    Math.random() *
                    .02 + .005

            });

        }

    }


    /* =================================================
       黑色背景
    ================================================= */

    function drawBackground(){

        const gradient =
            ctx.createRadialGradient(

                W * .5,
                H * .48,
                0,

                W * .5,
                H * .48,
                Math.max(W,H) * .85

            );


        gradient.addColorStop(
            0,
            "#171108"
        );


        gradient.addColorStop(
            .25,
            "#0b0804"
        );


        gradient.addColorStop(
            .62,
            "#030302"
        );


        gradient.addColorStop(
            1,
            "#000000"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }


    /* =================================================
       大面积环境金光
    ================================================= */

    function drawAmbientLight(){

        /* 左侧 */

        const left =
            ctx.createRadialGradient(

                W * .02,
                H * .48,
                0,

                W * .02,
                H * .48,
                W * .48

            );


        left.addColorStop(
            0,
            "rgba(255,190,70,.16)"
        );


        left.addColorStop(
            .3,
            "rgba(220,160,50,.07)"
        );


        left.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            left;


        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        /* 右上 */

        const right =
            ctx.createRadialGradient(

                W * .98,
                H * .02,
                0,

                W * .98,
                H * .02,
                W * .55

            );


        right.addColorStop(
            0,
            "rgba(255,210,120,.22)"
        );


        right.addColorStop(
            .3,
            "rgba(220,160,55,.08)"
        );


        right.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            right;


        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }


    /* =================================================
       绘制大型金色丝带
    ================================================= */

    function drawRibbon(
        offset,
        speed,
        amplitude,
        thickness,
        opacity
    ){

        const phase =
            time * speed +
            offset;


        const points = [];


        const segments = 100;


        for(
            let i = 0;
            i <= segments;
            i++
        ){

            const t =
                i / segments;


            const x =
                -W * .18 +
                W * 1.36 * t;


            /* 第一层大弯曲 */

            const wave1 =
                Math.sin(
                    t * Math.PI * 2.05 +
                    phase
                ) *
                amplitude;


            /* 第二层弯曲 */

            const wave2 =
                Math.sin(
                    t * Math.PI * 4.2 +
                    phase * .65
                ) *
                amplitude *
                .20;


            /* 慢慢上下呼吸 */

            const wave3 =
                Math.sin(
                    t * Math.PI * 1.15 +
                    phase * .4
                ) *
                amplitude *
                .12;


            const y =
                H * .48 +
                wave1 +
                wave2 +
                wave3;


            points.push({
                x:x,
                y:y
            });

        }


        ctx.save();


        /* =================================================
           外部巨大金色光晕
        ================================================= */

        ctx.beginPath();


        ctx.moveTo(
            points[0].x,
            points[0].y
        );


        for(
            let i = 1;
            i < points.length;
            i++
        ){

            ctx.lineTo(
                points[i].x,
                points[i].y
            );

        }


        ctx.strokeStyle =
            "rgba(255,190,65," +
            opacity * .20 +
            ")";


        ctx.lineWidth =
            thickness * 2.7;


        ctx.lineCap =
            "round";


        ctx.shadowBlur =
            80;


        ctx.shadowColor =
            "rgba(255,180,50,.65)";


        ctx.stroke();


        /* =================================================
           金色丝带主体
        ================================================= */

        ctx.beginPath();


        ctx.moveTo(
            points[0].x,
            points[0].y
        );


        for(
            let i = 1;
            i < points.length;
            i++
        ){

            ctx.lineTo(
                points[i].x,
                points[i].y
            );

        }


        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                W,
                H
            );


        gradient.addColorStop(
            0,
            "rgba(255,180,50,0)"
        );


        gradient.addColorStop(
            .12,
            "rgba(255,205,105," +
            opacity * .45 +
            ")"
        );


        gradient.addColorStop(
            .30,
            "rgba(255,230,165," +
            opacity +
            ")"
        );


        gradient.addColorStop(
            .48,
            "rgba(255,190,65," +
            opacity * .75 +
            ")"
        );


        gradient.addColorStop(
            .66,
            "rgba(255,225,145," +
            opacity * .9 +
            ")"
        );


        gradient.addColorStop(
            .86,
            "rgba(255,185,55," +
            opacity * .4 +
            ")"
        );


        gradient.addColorStop(
            1,
            "rgba(255,195,75,0)"
        );


        ctx.strokeStyle =
            gradient;


        ctx.lineWidth =
            thickness;


        ctx.lineCap =
            "round";


        ctx.shadowBlur =
            32;


        ctx.shadowColor =
            "rgba(255,195,70,.75)";


        ctx.stroke();


        /* =================================================
           丝带内部流光
        ================================================= */

        for(
            let line = -3;
            line <= 3;
            line++
        ){

            ctx.beginPath();


            for(
                let i = 0;
                i < points.length;
                i++
            ){

                const p =
                    points[i];


                const t =
                    i /
                    (points.length - 1);


                const offsetY =
                    line *
                    thickness *
                    .105;


                const yy =
                    p.y +
                    offsetY +
                    Math.sin(
                        t * 12 +
                        time * .0007 +
                        line
                    ) * 2;


                if(i === 0){

                    ctx.moveTo(
                        p.x,
                        yy
                    );

                }else{

                    ctx.lineTo(
                        p.x,
                        yy
                    );

                }

            }


            ctx.strokeStyle =
                "rgba(255,238,185," +
                opacity * .11 +
                ")";


            ctx.lineWidth =
                1;


            ctx.shadowBlur =
                8;


            ctx.stroke();

        }


        ctx.restore();

    }


    /* =================================================
       粒子
    ================================================= */

    function drawParticles(){

        for(
            let i = 0;
            i < particles.length;
            i++
        ){

            const p =
                particles[i];


            /* 向上漂浮 */

            p.y -= p.speed;


            /* 左右轻微摆动 */

            p.x +=
                Math.sin(
                    time * .001 +
                    p.phase
                ) *
                p.drift *
                .035;


            /* 出屏幕重新生成 */

            if(p.y < -20){

                p.y =
                    H + 20;

                p.x =
                    Math.random() * W;

            }


            const twinkle =
                .55 +
                Math.sin(
                    time *
                    p.twinkle +
                    p.phase
                ) *
                .45;


            ctx.beginPath();


            ctx.fillStyle =
                "rgba(255,215,125," +
                p.alpha *
                twinkle +
                ")";


            ctx.shadowBlur =
                p.size > 1.2
                ? 10
                : 4;


            ctx.shadowColor =
                "rgba(255,195,70,.8)";


            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }


        ctx.shadowBlur = 0;

    }


    /* =================================================
       大型星光
    ================================================= */

    function drawStars(){

        for(
            let i = 0;
            i < stars.length;
            i++
        ){

            const s =
                stars[i];


            const pulse =
                .5 +
                Math.sin(
                    time *
                    s.speed +
                    s.phase
                ) *
                .5;


            const alpha =
                s.alpha *
                (.55 +
                pulse * .45);


            /* 光点 */

            ctx.beginPath();


            ctx.fillStyle =
                "rgba(255,215,125," +
                alpha +
                ")";


            ctx.shadowBlur =
                16 +
                s.size * 5;


            ctx.shadowColor =
                "rgba(255,190,60,.95)";


            ctx.arc(
                s.x,
                s.y,
                s.size,
                0,
                Math.PI * 2
            );


            ctx.fill();


            /* 十字星 */

            if(s.size > 2){

                ctx.beginPath();


                ctx.strokeStyle =
                    "rgba(255,230,165," +
                    alpha * .65 +
                    ")";


                ctx.lineWidth =
                    .8;


                ctx.moveTo(
                    s.x - s.size * 4,
                    s.y
                );


                ctx.lineTo(
                    s.x + s.size * 4,
                    s.y
                );


                ctx.moveTo(
                    s.x,
                    s.y - s.size * 4
                );


                ctx.lineTo(
                    s.x,
                    s.y + s.size * 4
                );


                ctx.stroke();

            }

        }


        ctx.shadowBlur = 0;

    }


    /* =================================================
       底部金色反光
    ================================================= */

    function drawBottomGlow(){

        const y =
            H * .91;


        const glow =
            ctx.createRadialGradient(

                W * .5,
                y,
                0,

                W * .5,
                y,
                W * .65

            );


        glow.addColorStop(
            0,
            "rgba(255,190,65,.16)"
        );


        glow.addColorStop(
            .3,
            "rgba(220,150,45,.06)"
        );


        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            glow;


        ctx.fillRect(
            0,
            H * .72,
            W,
            H * .28
        );


        /* 横向电影光线 */

        const line =
            ctx.createLinearGradient(
                0,
                0,
                W,
                0
            );


        line.addColorStop(
            0,
            "rgba(255,190,70,0)"
        );


        line.addColorStop(
            .25,
            "rgba(255,210,110,.06)"
        );


        line.addColorStop(
            .5,
            "rgba(255,225,145,.25)"
        );


        line.addColorStop(
            .75,
            "rgba(255,210,110,.06)"
        );


        line.addColorStop(
            1,
            "rgba(255,190,70,0)"
        );


        ctx.beginPath();


        ctx.strokeStyle =
            line;


        ctx.lineWidth =
            2;


        ctx.shadowBlur =
            20;


        ctx.shadowColor =
            "rgba(255,195,70,.45)";


        ctx.moveTo(
            0,
            y
        );


        ctx.lineTo(
            W,
            y
        );


        ctx.stroke();


        ctx.shadowBlur = 0;

    }


    /* =================================================
       顶部镜头光晕
    ================================================= */

    function drawLensGlow(){

        const move =
            Math.sin(
                time * .00025
            );


        const x =
            W *
            (.82 + move * .04);


        const y =
            H * .03;


        const radius =
            Math.min(W,H) *
            .48;


        const gradient =
            ctx.createRadialGradient(

                x,
                y,
                0,

                x,
                y,
                radius

            );


        gradient.addColorStop(
            0,
            "rgba(255,225,160,.18)"
        );


        gradient.addColorStop(
            .2,
            "rgba(255,200,95,.07)"
        );


        gradient.addColorStop(
            .55,
            "rgba(255,180,60,.02)"
        );


        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }


    /* =================================================
       动画
    ================================================= */

    function animate(){

        time++;


        ctx.clearRect(
            0,
            0,
            W,
            H
        );


        /* 黑色底 */

        drawBackground();


        /* 环境光 */

        drawAmbientLight();


        /* 顶部镜头光 */

        drawLensGlow();


        /* =================================================
           三条金色丝带
        ================================================= */

        drawRibbon(
            0,
            .00040,
            Math.min(W,H) * .27,
            W < 768 ? 30 : 78,
            .72
        );


        drawRibbon(
            2.1,
            .00032,
            Math.min(W,H) * .23,
            W < 768 ? 22 : 58,
            .48
        );


        drawRibbon(
            4.3,
            .00025,
            Math.min(W,H) * .13,
            W < 768 ? 7 : 16,
            .28
        );


        /* 粒子 */

        drawParticles();


        /* 星光 */

        drawStars();


        /* 底部光 */

        drawBottomGlow();


        requestAnimationFrame(
            animate
        );

    }


    /* =================================================
       启动
    ================================================= */

    resize();

    createParticles();

    animate();


    /* =================================================
       窗口改变大小
    ================================================= */

    window.addEventListener(
        "resize",
        function(){

            resize();

            createParticles();

        }
    );


})();

</script>
