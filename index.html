body {
  min-height: 100vh;
  background-color: #070707;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(212, 188, 132, 0.12), transparent 45%),
    radial-gradient(circle at 80% 20%, rgba(212, 188, 132, 0.08), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(212, 188, 132, 0.15), transparent 55%),
    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
  background-size: auto, auto, auto, 44px 44px, 44px 44px;
  font-family: "Microsoft YaHei", PingFang SC, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* 第一层：缓慢流动的暗金网格 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(212, 188, 132, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 188, 132, 0.045) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
  animation: gridMove 18s linear infinite;
}


/* 第三层：边缘暗金光带 */
.edge-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(circle at 10% 50%, rgba(212, 188, 132, 0.12), transparent 35%),
    radial-gradient(circle at 90% 50%, rgba(212, 188, 132, 0.1), transparent 35%),
    radial-gradient(circle at 50% 10%, rgba(212, 188, 132, 0.08), transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(212, 188, 132, 0.14), transparent 40%);
  animation: edgeBreath 10s ease-in-out infinite alternate;
}

@keyframes gridMove {
  0% {
    background-position: 0 0, 0 0;
  }
  100% {
    background-position: 60px 60px, 60px 60px;
  }
}
@keyframes edgeBreath {
  0% {
    opacity: 0.5;
    transform: scale(1);
  }
  100% {
    opacity: 0.9;
    transform: scale(1.04);
  }
}

<canvas id="goldFlowBg" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
<script>
(function(){
  const canvas = document.getElementById('goldFlowBg');
  const ctx = canvas.getContext('2d');
  let width, height, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let particles = [];
  let flowArcs = [];
  let time = 0;

  function resize(){
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function init(){
    resize();
    particles = [];
    flowArcs = [];

    // 中心密集粒子
    const centerX = width / 2;
    const centerY = height / 2;

    for(let i = 0; i < 180; i++){
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * Math.min(width, height) * 0.35;
      particles.push({
        x: centerX + Math.cos(angle) * radius,
        y: centerY + Math.sin(angle) * radius,
        vx: Math.cos(angle) * (0.04 + Math.random() * 0.08),
        vy: Math.sin(angle) * (0.04 + Math.random() * 0.08),
        r: Math.random() * 1.6 + 0.4,
        a: Math.random() * 0.6 + 0.35,
        life: Math.random() * 300,
        fromCenter: true
      });
    }

    // 边缘粒子
    for(let i = 0; i < 120; i++){
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.08,
        vy: (Math.random() - 0.5) * 0.08,
        r: Math.random() * 1.2 + 0.3,
        a: Math.random() * 0.35 + 0.2,
        life: Math.random() * 300,
        fromCenter: false
      });
    }

    // 左侧大光弧
    flowArcs.push({
      type: 'left',
      baseX: -width * 0.25,
      baseY: height * 0.45,
      radius: Math.min(width, height) * 0.55,
      startAngle: 0.35,
      endAngle: 1.55,
      lineWidth: 90,
      alpha: 0.35,
      speed: 0.0004
    });

    // 右侧大光弧
    flowArcs.push({
      type: 'right',
      baseX: width * 1.25,
      baseY: height * 0.55,
      radius: Math.min(width, height) * 0.5,
      startAngle: -2.75,
      endAngle: -1.45,
      lineWidth: 110,
      alpha: 0.4,
      speed: 0.0005
    });

    // 中心横向流丝
    flowArcs.push({
      type: 'centerBar',
      y: centerY,
      width: width * 0.85,
      lineWidth: 14,
      alpha: 0.25,
      speed: 0.0008
    });

    // 中心竖向流丝
    flowArcs.push({
      type: 'centerBar',
      vertical: true,
      x: centerX,
      height: height * 0.7,
      lineWidth: 10,
      alpha: 0.2,
      speed: 0.0006
    });
  }

  function drawParticles(){
    for(let i = 0; i < particles.length; i++){
      const p = particles[i];
      p.life++;

      if(p.fromCenter){
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.9985;
        p.vy *= 0.9985;
      } else {
        p.x += p.vx + Math.sin(time * 0.001 + p.life * 0.02) * 0.015;
        p.y += p.vy + Math.cos(time * 0.001 + p.life * 0.02) * 0.015;
      }

      if(p.x < -50) p.x = width + 50;
      if(p.x > width + 50) p.x = -50;
      if(p.y < -50) p.y = height + 50;
      if(p.y > height + 50) p.y = -50;

      const twinkle = 0.55 + 0.45 * Math.sin(time * 0.005 + p.life * 0.04);
      ctx.beginPath();
      ctx.fillStyle = `rgba(255, 225, 170, ${p.a * twinkle})`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(230, 205, 144, 0.9)';
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawFlowArcs(){
    for(let i = 0; i < flowArcs.length; i++){
      const arc = flowArcs[i];

      if(arc.type === 'left' || arc.type === 'right'){
        arc.startAngle += arc.speed;
        arc.endAngle += arc.speed;

        const grad = ctx.createRadialGradient(
          arc.baseX, arc.baseY, arc.radius - arc.lineWidth,
          arc.baseX, arc.baseY, arc.radius + arc.lineWidth
        );
        grad.addColorStop(0, 'rgba(255, 220, 160, 0)');
        grad.addColorStop(0.45, `rgba(255, 215, 150, ${arc.alpha})`);
        grad.addColorStop(0.55, `rgba(255, 205, 120, ${arc.alpha * 0.85})`);
        grad.addColorStop(1, 'rgba(255, 220, 160, 0)');

        ctx.beginPath();
        ctx.strokeStyle = grad;
        ctx.lineWidth = arc.lineWidth;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 35;
        ctx.shadowColor = 'rgba(212, 188, 132, 0.9)';
        ctx.arc(arc.baseX, arc.baseY, arc.radius, arc.startAngle, arc.endAngle);
        ctx.stroke();
      }

      if(arc.type === 'centerBar'){
        const pulse = 0.75 + 0.25 * Math.sin(time * arc.speed * 12);

        if(arc.vertical){
          const grad = ctx.createLinearGradient(
            arc.x, arc.y - arc.height / 2,
            arc.x, arc.y + arc.height / 2
          );
          grad.addColorStop(0, 'rgba(255, 220, 160, 0)');
          grad.addColorStop(0.5, `rgba(255, 215, 150, ${arc.alpha * pulse})`);
          grad.addColorStop(1, 'rgba(255, 220, 160, 0)');

          ctx.beginPath();
          ctx.strokeStyle = grad;
          ctx.lineWidth = arc.lineWidth;
          ctx.lineCap = 'round';
          ctx.shadowBlur = 25;
          ctx.shadowColor = 'rgba(212, 188, 132, 0.7)';
          ctx.moveTo(arc.x, arc.y - arc.height / 2);
          ctx.lineTo(arc.x, arc.y + arc.height / 2);
          ctx.stroke();
        } else {
          const grad = ctx.createLinearGradient(
            (width - arc.width) / 2, arc.y,
            (width + arc.width) / 2, arc.y
          );
          grad.addColorStop(0, 'rgba(255, 220, 160, 0)');
          grad.addColorStop(0.5, `rgba(255, 215, 150, ${arc.alpha * pulse})`);
          grad.addColorStop(1, 'rgba(255, 220, 160, 0)');

          ctx.beginPath();
          ctx.strokeStyle = grad;
          ctx.lineWidth = arc.lineWidth;
          ctx.lineCap = 'round';
          ctx.shadowBlur = 25;
          ctx.shadowColor = 'rgba(212, 188, 132, 0.7)';
          ctx.moveTo((width - arc.width) / 2, arc.y);
          ctx.lineTo((width + arc.width) / 2, arc.y);
          ctx.stroke();
        }
      }
    }
    ctx.shadowBlur = 0;
  }

  function drawCenterGlow(){
    const centerX = width / 2;
    const centerY = height / 2;
    const glowSize = Math.min(width, height) * 0.28 + 40 * Math.sin(time * 0.004);

    const grad = ctx.createRadialGradient(
      centerX, centerY, 0,
      centerX, centerY, glowSize
    );
    grad.addColorStop(0, 'rgba(255, 225, 170, 0.35)');
    grad.addColorStop(0.4, 'rgba(255, 210, 140, 0.18)');
    grad.addColorStop(1, 'rgba(255, 220, 160, 0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, glowSize, 0, Math.PI * 2);
    ctx.fill();
  }

  function animate(){
    time++;
    ctx.clearRect(0, 0, width, height);

    drawCenterGlow();
    drawFlowArcs();
    drawParticles();

    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', init);
  init();
  animate();
})();
</script>
